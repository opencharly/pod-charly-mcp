charly-mcp:
    candy:
        description: |
            An MCP server exposing the full charly CLI as Streamable-HTTP tools on port 18765
            charly-mcp is a meta-composition (candy: [charly, supervisord]) with no
            install of its own: it bakes the charly binary + supervisord, runs
            `charly mcp serve --listen :18765` as a supervised service with a
            /workspace working directory plus a world-writable /workspace project
            mount so build-mode tools (box.build, box.list.*) can resolve a project
            checkout. Verifiable at build (the composed charly binary and the
            /workspace mount land in the image) and at deploy (the MCP endpoint comes
            up and enumerates tools derived from the charly Kong CLI model).
        bake_plugin:
            # plugin-mcp is the OUT-OF-TREE plugin that serves the `mcp:` check verb
            # (the github.com/modelcontextprotocol/go-sdk MCP CLIENT lives there, not in
            # charly's core check surface). Bake its pre-built provider binary into every
            # composing image at /usr/lib/charly/plugins/, so the in-container
            # `charly mcp serve` resolves the external `mcp` command at runtime — the
            # deployed container has neither the candy source nor a go toolchain to build
            # it. (generate.go emitBakedPlugins → plugin_loader.go bakedPluginBinary.)
            #
            # `bake_plugin:` IMPLIES `require:` (sdk/loaderkit/scan_candy.go populateFromYAML): the
            # baked plugin candy joins this candy's require chain, so (a) its version:
            # contributes to every composing image's EffectiveVersion (a baked-plugin
            # change forces a rebuild) and (b) it lands in the scanned candy set, where
            # the host's collectReferencedPluginWords build-connects it before the baked
            # `mcp:` checks dispatch — otherwise they SKIP with `unknown verb "mcp"`.
            # (box/<distro> adopts the matching @github pin via reconcile later — the
            # deliberate cross-repo lag; the R10 bed loads the LOCAL candy via the
            # superproject override.)
            - '@github.com/opencharly/plugin-mcp/candy/plugin-mcp:v2026.272.0329'
        candy:
            # the charly meta-candy, now its own repo (candy de-submodule cutover).
            # v2026.274.0345 is the current layer-charly release — the deterministic charly version pin.
            - '@github.com/opencharly/layer-charly:v2026.274.0345'
            - '@github.com/opencharly/layer-supervisord:v2026.271.1817'
        port:
            - 18765
        mcp_provide:
            - name: charly
              url: "http://{{.ContainerName}}:18765/mcp"
              transport: http
        volume:
            # Project checkout bind-mounted from the host so build-mode MCP tools
            # (box.build, box.inspect, box.list.*) have access to charly.yml +
            # candy/. Deployers point this at their opencharly repo via
            # `charly config <image> --bind project=/path/to/opencharly`. When absent or
            # empty, the project-dir-dependent MCP tools return a clear error
            # (`charly.yml not found`); the session-wide tools (status, version,
            # doctor, secrets, settings) continue to work.
            #
            # Volume name stays `project` (stable bind-mount API). In-container path
            # is `/workspace` — a neutral term that works whether the image runs as
            # root (HOME=/root) or uid 1000 (HOME=/home/user), and whether the
            # contents are an opencharly checkout or any other dev workspace.
            - name: project
              path: /workspace
        service:
            - name: charly-mcp
              # The MCP server defaults to 127.0.0.1 (loopback-only; P3). Inside the
              # container, binding 0.0.0.0 is normal and fine — the host only reaches
              # the server through the operator's explicit published port mapping.
              exec: "/usr/bin/charly mcp serve --listen 0.0.0.0:18765"
              restart: always
              enable: true
              scope: system
              # The project location is carried by the working_directory, not an env
              # var: the server's computeProjectPrefix checks cwd for charly.yml, and
              # the child inherits cwd. An unconditional CHARLY_PROJECT_DIR=/workspace
              # would make child commands resolve an empty /workspace (no bind mount)
              # and fail — breaking the auto-fallback to the default repo under the
              # no-env-stripping principle (children inherit the full environment).
              working_directory: /workspace
        plan:
            - run: mkdir=/workspace
              mkdir: /workspace
              mode: "0777"
              run_as: root
            # Seed a PLACEHOLDER project into /workspace.
            #
            # Without one, `charly mcp serve` starts with no project, so the plugin's
            # project prefix resolves to `--repo default` — and that prefix is computed
            # ONCE at server startup and closed over by every tool handler. Every project
            # tool then runs `git ls-remote https://github.com/opencharly/charly.git` from
            # INSIDE the venue, for the process lifetime. In a pod without egress DNS that
            # is a hard failure of `version`, `box.list.boxes` and `charly status --json`,
            # and it does not recover when a project appears later.
            #
            # A bind-mount over /workspace shadows this file, so an operator mounting a real
            # checkout is unaffected — this only decides what happens when nothing is mounted.
            #
            # The stamp is the MIGRATE FLOOR, not a current CalVer, because the correct stamp
            # is a property of the charly baked into THIS image and cannot be known here: a
            # stamp newer than the image's charly is rejected outright, and an older one fails
            # `charly box validate`. The migrate step below restamps it to whatever this
            # image's charly requires, which is the only image-independent way to get it right.
            - run: seed a placeholder project so the MCP server resolves locally, not over the network
              id: workspace-placeholder-project
              write: /workspace/charly.yml
              mode: "0666"
              run_as: root
              content: |
                  version: 2026.174.1100
                  workspace:
                      candy:
                          version: 2026.174.1100
                          description: >-
                              Placeholder project. charly resolves a project from /workspace;
                              without one the MCP server falls back to fetching opencharly/charly
                              over the network. Bind-mount your own checkout over /workspace to
                              replace this.
                          plan:
                              - run: mark the placeholder workspace
                                id: ws-marker
                                mkdir: /workspace/.charly-placeholder
                                run_as: root
                              - check: the placeholder marker exists
                                id: ws-probe
                                file:
                                    file: /workspace/.charly-placeholder
                                    filetype: directory
            - run: restamp the placeholder to this image's own schema version
              id: workspace-placeholder-migrate
              command: HOME=${HOME:-/root} charly migrate -C /workspace
              run_as: root
            - check: the composed charly candy bakes the charly CLI binary at /usr/bin/charly
              file:
                file: /usr/bin/charly
                exists: true
            - check: the world-writable /workspace project mount exists in the built image
              file:
                file: /workspace
                filetype: directory
            - check: the placeholder project is seeded, so the MCP server never reaches the network for one
              id: workspace-project-seeded
              file:
                file: /workspace/charly.yml
                exists: true
            - check: the supervised charly-mcp service is running
              context:
                - runtime
              service:
                service: charly-mcp
                running: true
            - check: the MCP endpoint enumerates charly CLI tools over Streamable HTTP
              mcp:
                method: list-tools
                mcp_name: charly
              stdout:
                - contains: box.list.boxes
                - contains: version
              context:
                - runtime
            - agent-check: the charly-mcp service keeps answering MCP clients on port 18765, restarting automatically (restart=always) if the charly mcp serve process exits
            - check: addr=127.0.0.1:${HOST_PORT:18765}
              id: charly-mcp-port
              timeout: 5s
              context:
                - runtime
              addr:
                addr: 127.0.0.1:${HOST_PORT:18765}
                reachable: true
            - check: mcp=ping
              id: mcp-charly-ping
              mcp:
                method: ping
                mcp_name: charly
              timeout: 30s
              eventually: 90s
              retry_interval: 3s
              context:
                - runtime
            - check: mcp=list-tools
              id: mcp-charly-list-tools
              mcp:
                method: list-tools
                mcp_name: charly
              stdout:
                - contains: box.list.boxes
                - contains: status
                - contains: version
              context:
                - runtime
            - check: mcp=call
              id: mcp-charly-call-version
              mcp:
                method: call
                tool: version
                input: "{}"
                mcp_name: charly
              exit_status: 0
              stdout:
                - matches: "[0-9]{4}\\.[0-9]+"
              context:
                - runtime
            - check: mcp=call
              id: mcp-charly-call-list-boxes
              mcp:
                method: call
                tool: box.list.boxes
                input: "{}"
                mcp_name: charly
              timeout: 90s
              exit_status: 0
              context:
                - runtime

charly-mcp-skill:
    skill:
        name: charly-mcp
        family: coder
        owner: charly-mcp
        description: |-
            MCP server exposing the full charly CLI as tools (Streamable HTTP on port
            18765). Meta-layer composition — layers: [charly, supervisord] — ships only
            service wiring + `/workspace` bind-mount + a `/workspace` service working directory.
            Auto-falls back to the upstream opencharly/charly repo when /workspace
            has no charly.yml. Use when composing an MCP gateway into any box so LLM
            agents can drive charly remotely.
